name: Android CI
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_preview:
        description: 'Publish tested debug APK as a prerelease'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug :app:lintDebug :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: android-development-apk
          path: app/build/outputs/apk/debug/app-debug.apk
  smoke:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-development-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/smoke.sh
  publish-preview:
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.publish_preview) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-preview]')))
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-development-apk
      - name: Publish tested preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="preview-${GITHUB_RUN_ID}"
          sha256sum app-debug.apk > SHA256SUMS.txt
          gh release create "$tag" app-debug.apk SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title "Android development preview $tag" --notes "Debug-signed APK. Build, lint, unit tests and emulator smoke checks passed. Not a production release."
